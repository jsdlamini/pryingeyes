# coturn for LOCAL DEVELOPMENT (docker compose). See docker/turnserver.prod.conf for production.
# The app hands each signed-in user short-lived credentials signed with TURN_SECRET
# (TURN REST API / "use-auth-secret"); coturn checks them itself, so there are no user accounts here.
listening-port=3478
fingerprint
use-auth-secret
realm=pryingeyes.local
# Relay ports (UDP). Keep this range small locally; open it on the firewall in production.
min-port=49160
max-port=49200
no-cli
no-tls
no-dtls
no-multicast-peers
# Both test browsers run on this computer, so allow relaying to this machine's own addresses.
allow-loopback-peers
# Media is DTLS-SRTP encrypted end to end; coturn only forwards packets. Don't log peers' addresses.
no-stdout-log
log-file=/dev/null
simple-log
