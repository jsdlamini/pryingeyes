# coturn for the production Docker setup (docker-compose.prod.yml) behind Cloudflare.
# The relay host is DNS-only (grey cloud): Cloudflare's proxy can't carry TURN/UDP.
# No TLS: call audio is already end-to-end encrypted (DTLS-SRTP), and relay access uses
# short-lived HMAC credentials from the app. The secret, realm and external IP come from the
# compose command line (TURN_SECRET, TURN_HOST, TURN_EXTERNAL_IP in .env).
listening-port=3478
fingerprint
use-auth-secret
min-port=49152
max-port=65535
no-tls
no-dtls
no-cli
no-multicast-peers
# Stop the relay being used to reach private networks (SSRF through TURN).
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
# Abuse limits.
user-quota=4
total-quota=1000
max-bps=256000
stale-nonce=600
# Logs to the container output; peer addresses stay out of it.
log-file=stdout
simple-log
