# coturn for PRODUCTION. Run on a host with a public IP (or 1:1 NAT), here pryingeyes.idealsoftwaresolutions.com.
# Start with: turnserver -c /etc/turnserver.conf --static-auth-secret="$TURN_SECRET"
listening-port=3478
tls-listening-port=5349
fingerprint
use-auth-secret
realm=pryingeyes.idealsoftwaresolutions.com
server-name=pryingeyes.idealsoftwaresolutions.com
# Behind NAT: external-ip=<public-ip>/<private-ip>
# external-ip=203.0.113.10
min-port=49152
max-port=65535
cert=/etc/letsencrypt/live/pryingeyes.idealsoftwaresolutions.com/fullchain.pem
pkey=/etc/letsencrypt/live/pryingeyes.idealsoftwaresolutions.com/privkey.pem
no-cli
no-multicast-peers
no-tlsv1
no-tlsv1_1
# Stop the relay being used to reach private networks (SSRF through TURN).
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
# Abuse limits: allocations per credential and in total; ~0.3 MB/min per call needs little bandwidth.
user-quota=4
total-quota=1000
max-bps=256000
stale-nonce=600
# Keep peer addresses out of logs.
log-file=/var/log/turnserver.log
simple-log
